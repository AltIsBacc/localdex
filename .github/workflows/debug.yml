name: Debug build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          if ! ./gradlew --no-daemon assembleDebug > build.log 2>&1; then
            summary=$(grep -E "^e: |^w: .*error|What went wrong|Could not|Caused by|FAILED|^> |error:" build.log | head -c 6000 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle failure::${summary}"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: localdex-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
