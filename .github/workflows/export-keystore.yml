name: Export keystore

on:
  push:
    branches: [tmp/export-keystore]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Print keystore
        shell: bash
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          if [ -f ~/.android/debug.keystore ]; then
            echo "KEYSTORE_BEGIN"
            base64 -w0 ~/.android/debug.keystore
            echo
            echo "KEYSTORE_END"
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E "Alias|SHA256|Valid"
          else
            echo "NO KEYSTORE"
          fi
